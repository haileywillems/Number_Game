<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Guess a Number Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- outside div -->
    <div class="container">
        <h1>Number duessing game</h1>
        <p>Im thinking of a number between 1-100. Can you guess it?</p>
        <!--Game guess function call-->
        <div class="game">
            <input 
            type="number" 
            id="guess" 
            placeholder="Enter your guess" 
            min="1" 
            max="100"/>
            <button onclick="checkGuess()">Submit Guess</button>
        </div>
        <!-- feedback on guess -->
         <p id="feedback"></p>
         <button onclick="resetGame()">Play Again</button>
    </div>
</body>
</html>
